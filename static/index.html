<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sicuritalia · Sales Opportunity Hub</title>
<meta name="theme-color" content="#f5f5f7">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Gestione opportunità di vendita, agenda appuntamenti e SLA per la rete commerciale">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mut:#6e6e73;--line:rgba(0,0,0,.08);--pri:#0071e3;--pri-d:#0062c4;--tint:rgba(0,113,227,.1);
--ok:#248a3d;--ko:#d70015;--warn:#b25000;--info:#0a84a8;--viol:#8944ab;--r:18px;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.05);
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font:15px/1.5 var(--font);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3{margin:0 0 .5rem;font-weight:700;letter-spacing:-.022em}h2{font-size:1.85rem;line-height:1.15;margin-bottom:1rem}h3{font-size:1.1rem;font-weight:650}
a{color:var(--pri)}
:focus-visible{outline:3px solid rgba(0,113,227,.45);outline-offset:2px;border-radius:10px}
.hide{display:none!important}
/* chat */
.chatbox{background:var(--bg);border-radius:20px;padding:12px;max-height:min(75vh,640px);overflow:auto;margin-bottom:10px}
.bub{max-width:96%;padding:9px 14px;border-radius:20px;margin:6px 0;font-size:14.5px}
.bub.bot{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);border-bottom-left-radius:6px}
.bub.me{background:var(--pri);color:#fff;margin-left:auto;white-space:pre-wrap;border-bottom-right-radius:6px}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:980px;padding:9px 18px;cursor:pointer;font-weight:600;transition:background .15s,transform .1s}
.btn:hover{background:var(--pri-d)}.btn:active{transform:scale(.97)}
.btn.sec{background:var(--tint);color:var(--pri);border:0}.btn.sec:hover{background:rgba(0,113,227,.18)}
.btn.ok{background:#34c759;color:#fff}.btn.ok:hover{background:#2db34f}.btn.ko{background:#ff3b30}.btn.ko:hover{background:#e0342a}.btn.warn{background:#ff9500}.btn.warn:hover{background:#e08400}
.btn.sm{padding:5px 13px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{border:1px solid rgba(0,0,0,.14);border-radius:12px;padding:9px 12px;background:#fff;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px rgba(0,113,227,.2)}
input[type=checkbox]{accent-color:var(--pri);width:17px;height:17px}
textarea{width:100%;min-height:70px}
label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:0 1 auto}
.grow{flex:1 1 200px!important}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12.5px;font-weight:600;color:var(--mut)}
.tw{overflow-x:auto}
tr.click{cursor:pointer;transition:background .12s}tr.click:hover{background:rgba(0,113,227,.06)}
.dup{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:#fff4e0;color:#a15c00;border:1px solid #f5d79e;max-width:100%}
.dup.certo{background:#ffe9e7;color:#b3261e;border-color:#f3b8b3}
.rowdup{background:#fff8ec}
.rowdup.certo{background:#fff1f0}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(0,0,0,.06);color:#48484a;white-space:nowrap}
.b-da_gestire{background:rgba(255,149,0,.16);color:#9a5300}.b-appuntamento{background:rgba(50,173,230,.16);color:#00678f}
.b-in_lavorazione{background:rgba(0,122,255,.13);color:#0a5bc4}.b-preventivo{background:rgba(255,204,0,.22);color:#8a6400}.pvrow{border:1px solid #e5e5ea;border-radius:12px;padding:10px;margin:8px 0;background:#fafafc}
.b-da_riprogrammare{background:rgba(175,82,222,.14);color:#7d3a9e}.b-contratto{background:rgba(52,199,89,.18);color:#1a7a35}.b-ko{background:rgba(255,59,48,.14);color:#c4160b}
.b-scad{background:rgba(255,59,48,.14);color:#c4160b}
.mut{color:var(--mut)}.small{font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi.clk{cursor:pointer;transition:transform .12s}.kpi.clk:hover{transform:translateY(-2px)}
.kpi{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.03em}.kpi span{font-size:13px;color:var(--mut);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bar{height:8px;background:rgba(0,0,0,.07);border-radius:99px;overflow:hidden;display:flex;min-width:80px}.bar i{display:block;height:100%}
/* shell */
#app{display:flex;min-height:100vh}
nav{width:236px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);color:var(--ink);padding:18px 12px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line)}
nav .brand{font-weight:700;font-size:16px;padding:4px 10px 14px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:12px;color:#3a3a3c;text-decoration:none;cursor:pointer;margin-bottom:2px;font-weight:500;transition:background .12s}
nav a>span:first-child{display:flex;align-items:center;gap:11px}
nav a svg{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{background:rgba(0,0,0,.05)}nav a.on{background:var(--tint);color:var(--pri);font-weight:600}
nav .pill{background:#ff3b30;color:#fff;border-radius:99px;font-size:11px;font-weight:600;padding:1px 7px}
main{flex:1;min-width:0;padding:22px 28px 90px;max-width:1280px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
main>.top{position:sticky;top:0;z-index:10;margin:-22px -28px 18px;padding:12px 28px;background:rgba(245,245,247,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.who{font-size:13.5px;color:var(--mut)}.who b{color:var(--ink)}
@media(max-width:760px){
 #app{flex-direction:column}
 nav{width:100%;height:auto;position:fixed;bottom:0;left:0;right:0;top:auto;z-index:20;display:flex;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;border-top:1px solid var(--line);border-right:0;background:rgba(250,250,252,.86)}
 nav .navlogo{display:none}nav a{flex:0 0 auto;font-size:10.5px;padding:5px 12px;margin:0;border-radius:10px;min-width:64px}
 nav a>span:first-child{flex-direction:column;gap:2px}nav a.on{background:transparent}
 main{padding:14px 14px 96px}main>.top{margin:-14px -14px 14px;padding:10px 14px}
 h2{font-size:1.55rem}.kpi b{font-size:28px}
}
/* logo */
.logo{display:block;height:auto}
.navlogo{padding:4px 6px;margin:2px 0 18px}
.navlogo img{width:100%;max-width:180px;margin:0 auto 0 4px;mix-blend-mode:multiply}
.toplogo{height:28px;width:auto;mix-blend-mode:multiply}
.toplogo-m{display:none}

/* organigramma, tendine, zone */
.orgn{margin:8px 0}.orgc{border-radius:14px;padding:10px 14px;background:#fff;box-shadow:0 0 0 1px var(--line),0 2px 8px rgba(0,0,0,.03);border-left:5px solid var(--pri)}
.orgn.r-direttore>.orgc{border-left-color:#1d1d1f}.orgn.r-district>.orgc{border-left-color:#af52de}.orgn.r-team_leader>.orgc{border-left-color:#32ade6}
.orgn.r-agente>.orgc{border-left-color:#34c759}.orgn.r-recuperatore>.orgc{border-left-color:#ff9500}
.orgch{margin-left:16px;padding-left:14px;border-left:2px solid var(--line)}
.chip{display:inline-block;background:rgba(0,0,0,.06);color:#48484a;border-radius:7px;padding:0 7px;font-size:11px;font-weight:600;margin-left:3px}
details.dd{border-radius:14px;background:#fff;margin:8px 0;box-shadow:0 0 0 1px var(--line)}
details.dd>summary{padding:11px 14px;cursor:pointer;font-weight:600;list-style:none}
details.dd>summary::-webkit-details-marker{display:none}details.dd>summary::after{content:"▾";float:right;color:var(--mut)}
details.dd[open]>summary::after{content:"▴"}
.ddb{padding:4px 14px 12px;max-height:320px;overflow:auto;border-top:1px solid var(--line)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 12px}
/* modal */
.leaflet-container,#mapc{isolation:isolate;z-index:0}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:3000;animation:fadein .18s ease-out}
.modal{background:#fff;border-radius:24px;max-width:720px;width:100%;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .22s cubic-bezier(.2,.9,.3,1.1)}
.modal h2{display:flex;justify-content:space-between;gap:10px;font-size:1.5rem}
@keyframes fadein{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.x{background:rgba(0,0,0,.06);border:0;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;color:var(--mut);flex:none}.x:hover{background:rgba(0,0,0,.1)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:rgba(29,29,31,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;padding:11px 20px;border-radius:980px;z-index:3100;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .22s ease-out}
.toast.e{background:rgba(215,0,21,.94)}
.login{max-width:400px;margin:11vh auto;padding:0 16px}
.login .card{padding:32px 28px;border-radius:28px;box-shadow:0 2px 4px rgba(0,0,0,.04),0 24px 60px rgba(0,0,0,.09)}
.login h2{text-align:center;font-size:1.7rem}
.login .btn{width:100%;padding:12px;font-size:16px}
html{background:linear-gradient(180deg,#fbfbfd 0,#f5f5f7 340px) no-repeat,#f5f5f7}body{background:transparent}
.ev{border-left:3px solid rgba(0,113,227,.25);padding:2px 0 2px 12px;margin:8px 0}
.perm{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.chk{display:flex;gap:9px;align-items:center;margin:4px 0;font-size:14px;color:var(--ink);font-weight:400}
.day{margin-bottom:14px}.day h3{display:flex;justify-content:space-between}
.loc{font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 3px}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:14px;margin-bottom:6px;cursor:pointer;background:#fff;box-shadow:0 0 0 1px var(--line);transition:background .12s,transform .1s}
.item:hover{background:rgba(0,113,227,.05)}.item:active{transform:scale(.99)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="root"></div>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S={me:null,perm:new Set(),meta:null,agenti:[],page:null,unread:0};
const STATO={da_gestire:"Da gestire",in_lavorazione:"In lavorazione",preventivo:"Preventivo inviato",appuntamento:"Appuntamento",da_riprogrammare:"Da riprogrammare",contratto:"Contratto",ko:"KO"};
const CAT={customer_base:"Customer base",prospect:"Prospect",disdetta:"Disdette"};
const SOTTO={lead:"Lead",nuova_nata:"Nuova nata",lead_prospect:"Lead prospect"};
const REG={colonna_agente:"Colonna «Agente» del file",territorio:"Per territorio dell'agente",round_robin:"Ripartizione equa per carico",non_assegnare:"Non assegnare (lo fa il direttore)"};
const GIORNI=["dom","lun","mar","mer","gio","ven","sab"];

window.addEventListener("error",e=>{try{toast("Errore: "+(e.message||"sconosciuto")+" ("+(e.lineno||"?")+")",1)}catch(_){}});
window.addEventListener("unhandledrejection",e=>{try{toast("Errore: "+((e.reason&&e.reason.message)||e.reason),1)}catch(_){}});
async function api(path,opt={}){
  const o={method:opt.method||"GET",headers:{"X-Requested-With":"SOH"},credentials:"same-origin"};
  if(opt.json!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(opt.json);o.method=opt.method||"POST"}
  if(opt.form){o.body=opt.form;o.method="POST"}
  const r=await fetch("/api"+path,o);
  if(opt.raw)return r;
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(d.error||("Errore "+r.status));e.status=r.status;e.data=d;throw e}
  return d;
}
function toast(m,err){const t=document.createElement("div");t.className="toast"+(err?" e":"");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3800)}
function fmtDT(s){if(!s)return"";const d=new Date(s.replace(" ","T"));return d.toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
function fmtD(s){const d=new Date(s+"T12:00:00");return GIORNI[d.getDay()]+" "+d.toLocaleDateString("it-IT",{day:"2-digit",month:"long"})}
const ESCH={parlato:"Ho parlato con il cliente",non_risponde:"Non risponde",da_richiamare:"Da richiamare",numero_errato:"Numero errato / non raggiungibile",rifiuta:"Il cliente rifiuta"};
const MOTNR={scadenza_naturale:"Portata a naturale scadenza",con_penali:"Con applicazione penali",senza_penali:"Senza applicazione penali",non_lavorabile:"Non lavorabile"};
const eur=v=>(v==null?"–":Number(v).toLocaleString("it-IT",{style:"currency",currency:"EUR"}));
const badge=(s,o)=>{const dis=o&&o.categoria==="disdetta"&&(s==="contratto"||s==="ko");return `<span class="badge b-${s}">${dis?(s==="contratto"?"Recuperata":"Non recuperata"):(STATO[s]||s)}${o&&o.con_preventivo&&s==="appuntamento"?" · preventivo":""}</span>`};
function sla(o){if(o.stato!=="da_gestire"||o.ore_residue==null)return"";
  if(o.scaduta)return `<span class="badge b-scad">SLA scaduto</span>`;
  return `<span class="small mut">${o.ore_residue<48?Math.max(0,Math.round(o.ore_residue))+"h":Math.round(o.ore_residue/24)+"g"} all'SLA</span>`}
const can=f=>S.perm.has(f);
function modal(html,wide){
  const m=document.createElement("div");m.className="mask";
  m.innerHTML=`<div class="modal" ${wide?'style="max-width:920px"':""}>${html}</div>`;
  m.addEventListener("mousedown",e=>{if(e.target===m)m.remove()});
  document.body.appendChild(m);
  m.close=()=>m.remove();m.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>m.remove());
  return m;
}
const closeBtn='<button class="x" data-x>&times;</button>';

/* ------------------------------------------------ grafici SVG */
function lineChart(data,series,h=190){
  const W=640,P={l:30,r:8,t:10,b:22};const n=data.length;
  const max=Math.max(1,...data.flatMap(d=>series.map(s=>d[s.k])));
  const x=i=>P.l+(W-P.l-P.r)*i/(n-1||1),y=v=>P.t+(h-P.t-P.b)*(1-v/max);
  let g="";
  for(let t=0;t<=4;t++){const v=Math.round(max*t/4);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e7ef"/><text x="${P.l-5}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#6b7488">${v}</text>`}
  const st=Math.max(2,Math.ceil(n/10));data.forEach((d,i)=>{if(i%st===0||(i===n-1&&(n-1)%st>=Math.ceil(st/2)))g+=`<text x="${x(i)}" y="${h-6}" font-size="10" text-anchor="middle" fill="#6b7488">${d.data.slice(8)}/${d.data.slice(5,7)}</text>`});
  series.forEach(s=>{const pts=data.map((d,i)=>`${x(i)},${y(d[s.k])}`).join(" ");
    g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${pts}"/>`;
    data.forEach((d,i)=>g+=`<circle cx="${x(i)}" cy="${y(d[s.k])}" r="${n>40?2:3}" fill="${s.c}"><title>${d.data}: ${s.l} ${d[s.k]}</title></circle>`)});
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img">${g}</svg><div class="small">${series.map(s=>`<span style="color:${s.c}">●</span> ${s.l}`).join(" &nbsp; ")}</div>`;
}
function colChart(labels,series,fmt=v=>v,h=210){
  const W=520,pl=44,pb=26,pt=14,max=Math.max(1,...series.flatMap(s=>s.vals)),top=(()=>{const m=Math.pow(10,Math.floor(Math.log10(max)));return Math.ceil(max/m*2)/2*m||1})();
  const iw=W-pl-8,ih=h-pb-pt,g=iw/labels.length,bw=Math.min(34,(g-14)/series.length);
  let o=`<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto" role="img">`;
  for(let k=0;k<=4;k++){const y=pt+ih-ih*k/4;o+=`<line x1="${pl}" x2="${W-8}" y1="${y}" y2="${y}" stroke="#e5e5ea"/><text x="${pl-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#86868b">${fmt(Math.round(top*k/4*10)/10)}</text>`}
  labels.forEach((l,i)=>{const x0=pl+g*i+(g-bw*series.length)/2;series.forEach((s,j)=>{const v=s.vals[i],bh=ih*v/top;o+=`<rect x="${x0+bw*j}" y="${pt+ih-bh}" width="${bw-3}" height="${Math.max(bh,v?1:0)}" rx="3" fill="${s.c}"><title>${s.l}: ${fmt(v)}</title></rect>${v?`<text x="${x0+bw*j+(bw-3)/2}" y="${pt+ih-bh-3}" text-anchor="middle" font-size="9" fill="#444">${fmt(v)}</text>`:""}`});
    o+=`<text x="${pl+g*i+g/2}" y="${h-8}" text-anchor="middle" font-size="10" fill="#6e6e73">${l}</text>`});
  return o+`</svg><div class="row small" style="gap:12px;margin-top:2px">${series.map(s=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${s.c};margin-right:4px"></i>${s.l}</span>`).join("")}</div>`}
function donut(parts,total,label){
  const R=54,C=2*Math.PI*R;let off=0,g="";
  parts.forEach(p=>{const l=total?C*p.v/total:0;g+=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${p.l}: ${p.v}</title></circle>`;off+=l});
  return `<div class="row" style="align-items:center"><svg viewBox="0 0 140 140" width="140" height="140">${g}<text x="70" y="68" text-anchor="middle" font-size="24" font-weight="700">${total}</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="#6b7488">${label}</text></svg>
  <div class="small">${parts.map(p=>`<div><span style="color:${p.c}">●</span> ${p.l}: <b>${p.v}</b></div>`).join("")}</div></div>`;
}
function stackBar(parts,total){return `<div class="bar">${parts.map(p=>`<i style="width:${total?100*p.v/total:0}%;background:${p.c}" title="${p.l}: ${p.v}"></i>`).join("")}</div>`}

/* ------------------------------------------------ avvio / login */
async function boot(){
  try{const d=await api("/me");await afterLogin(d)}catch(e){showLogin()}
}
function showLogin(msg){
  $("#root").innerHTML=`<div class="login"><div class="card"><img class="logo loginlogo" src="/static/logo.png" alt="Sicuritalia"><h2 style="text-align:center">Sales Opportunity Hub</h2><p class="mut small">Accedi con le tue credenziali.</p>

async function afterLogin(d){

  S.meta=await api("/meta");

}

function go(p){
  S.page=p;document.querySelectorAll("nav a[data-p]").forEach(a=>a.classList.toggle("on",a.dataset.p===p));
  const pg=PAGES.find(x=>x[0]===p);const el=$("#page");
  if(!pg){el.innerHTML='<div class="card">Nessuna funzione abilitata per il tuo profilo. Contatta il tuo responsabile.</div>';return}
  el.innerHTML='<div class="mut">Caricamento…</div>';
  pg[4](el).catch(e=>{el.innerHTML=`<div class="card" style="color:var(--ko)">${esc(e.message)}</div>`});
}

const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const PRESETS=[["","Tutto il periodo"],["7","Ultimi 7 giorni"],["30","Ultimi 30 giorni"],["mese","Questo mese"],["mesep","Mese scorso"],["anno","Quest'anno"],["x","Date a scelta"]];
function presetDates(k){const t=new Date(),y=t.getFullYear(),m=t.getMonth();
  if(k==="7"||k==="30"){const f=new Date(t);f.setDate(f.getDate()-(+k-1));return[ymd(f),ymd(t)]}
  if(k==="mese")return[ymd(new Date(y,m,1)),ymd(t)];
  if(k==="mesep")return[ymd(new Date(y,m-1,1)),ymd(new Date(y,m,0))];
  if(k==="anno")return[ymd(new Date(y,0,1)),ymd(t)];
  return["",""]}
function dashQS(){const q=new URLSearchParams();
  if(DF.area_id)q.set("area_id",DF.area_id);if(DF.categoria)q.set("categoria",DF.categoria);
  if(DF.agent_ids.length)q.set("agent_ids",DF.agent_ids.join(","));if(DF.campaign_ids.length)q.set("campaign_ids",DF.campaign_ids.join(","));
  if(DF.dal)q.set("dal",DF.dal);if(DF.al)q.set("al",DF.al);return q}

function multiPick({titolo,voci,sel,tutti,onOk}){
  const cur=new Set(sel.map(String));
  const m=modal(`<h2>${esc(titolo)}${closeBtn}</h2><input id="mpq" placeholder="Cerca…" style="width:100%;margin-bottom:8px">
   <div class="row" style="margin-bottom:6px"><button class="btn sec sm" id="mpa">Seleziona tutti</button><button class="btn sec sm" id="mpn">${esc(tutti)}</button><span class="small mut" id="mpc"></span></div>
   <div id="mpl" style="max-height:52vh;overflow:auto"></div><p style="margin-top:12px"><button class="btn" id="mpok">Applica</button></p>`);
  const draw=()=>{const q=$("#mpq",m).value.trim().toLowerCase();let last=null,h="";
    voci.filter(v=>!q||(v.label+" "+(v.sub||"")+" "+(v.gruppo||"")).toLowerCase().includes(q)).forEach(v=>{
      if(v.gruppo!==last){last=v.gruppo;if(v.gruppo)h+=`<div class="small mut" style="margin:10px 0 2px;font-weight:600">${esc(v.gruppo)}</div>`}
      h+=`<label class="chk"><input type="checkbox" value="${v.id}" ${cur.has(String(v.id))?"checked":""}> <span>${esc(v.label)}${v.sub?` <span class="mut small">${esc(v.sub)}</span>`:""}</span></label>`});
    $("#mpl",m).innerHTML=h||'<div class="mut small">Nessun risultato</div>';
    $("#mpl",m).querySelectorAll("input").forEach(i=>i.onchange=()=>{i.checked?cur.add(i.value):cur.delete(i.value);cnt()});cnt()};
  const cnt=()=>$("#mpc",m).textContent=cur.size?cur.size+" selezionati":tutti;
  $("#mpq",m).oninput=draw;$("#mpa",m).onclick=()=>{voci.forEach(v=>cur.add(String(v.id)));draw()};$("#mpn",m).onclick=()=>{cur.clear();draw()};
  $("#mpok",m).onclick=()=>{m.close();onOk([...cur].map(Number))};draw();
}

      <div><h4 style="margin:0 0 4px">Esiti ${st.anno}</h4>${donut([{v:st.totale.recuperate,c:"#16a34a",l:"Recuperate"},{v:st.totale.non_recuperate,c:"#dc2626",l:"Non recuperate"},{v:st.totale.non_lavorabili,c:"#9ca3af",l:"Non lavorabili (escluse)"},{v:st.totale.aperte,c:"#f59e0b",l:"Ancora aperte"}],st.totale.ricevute,"disdette")}</div>
      ${st.totale.non_recuperate?`<div><h4 style="margin:0 0 4px">Perché non recuperate</h4>${donut(motivi.filter(m=>!m.escluso&&m.n).map((m,k)=>({v:m.n,c:["#dc2626","#f97316","#a855f7","#64748b"][k%4],l:m.label.replace("Non recuperata: ","")})),st.totale.non_recuperate,"non recuperate")}</div>`:""}
     </div>`:""}
     <div class="tw"><table><tr><th>Periodo</th><th>Ricevute</th><th>Ancora aperte</th><th>Esitate</th><th>Non lavorabili (escluse)</th><th>Recuperate</th><th>Valore recuperato</th><th>Canone originario lavorate</th><th>Non recuperate</th></tr>
     ${T.map(t=>`<tr style="${t.trimestre===0?"font-weight:600;background:#f5f5f7":""}"><td>${t.label}<div class="small mut">${t.mesi}</div>${t.trimestre?(t.definitiva?'<span class="badge b-contratto">definitiva</span>':`<span class="badge b-da_gestire" title="Lavorazione consentita fino al ${new Date(t.lavorazione_fino+"T12:00:00").toLocaleDateString("it-IT")}">provvisoria · definitiva dal ${new Date(t.definitiva_dal+"T12:00:00").toLocaleDateString("it-IT")}</span>`):""}</td>

    $("#dsa",box).onchange=e=>{DSANNO=e.target.value;loadStatDisdette(area)};
    if($("#dsx",box))$("#dsx",box).onclick=()=>{location.href="/api/statistiche/disdette.xlsx?anno="+st.anno+(area?"&area_id="+area:"")};

  const lab=()=>{const ha=$("#et",m).value==="lead"&&$("#eap",m).value;$("#emsave",m).textContent=ha?"Crea e inserisci in agenda":"Crea opportunità";$("#emsave2",m).style.display=ha?"":"none"};

    if(me){$("#eas",m).innerHTML=`<p class="small" style="color:var(--ok)">Verrà assegnata a te e potrai gestirla subito.</p>`;return}

      if(e.status!==409)toast(e.message,1);
    }
  };
  $("#emsave",m).onclick=()=>save(false,true,false);
  $("#emsave2",m).onclick=()=>save(false,false,false);
}

/* avviso quando l'agenda dell'agente è piena o ci sono appuntamenti concomitanti: si può inserire comunque */
function confermaAppuntamento(info,chi){
  return new Promise(res=>{
    let fatto=false;const fin=v=>{if(!fatto){fatto=true;res(v)}};
    const conc=new Set(info.concomitanti.map(x=>x.id));
    const righe=info.giorno.concat([{id:0,ora:info.ora,cliente:"Nuovo appuntamento",localita:"",nuovo:true}]).sort((a,b)=>a.ora<b.ora?-1:1);
    const m=modal(`<h2>Controlla l'agenda${closeBtn}</h2>
     <p style="margin-top:0">${chi?`<b>${esc(chi)}</b> · `:""}${esc(fmtD(info.data))}</p>
     <p style="color:var(--warn);font-weight:500">${esc(info.avviso)}</p>

  if($("#aok",m))$("#aok",m).onclick=async()=>{let data=$("#ad",m).value,ora=$("#ah",m).value,forza=false;
    for(;;){
      try{await api(`/opportunities/${id}/appuntamento`,{json:{data,ora,forza}});m.close();toast("Appuntamento fissato");if(reload)reload();return}
      catch(e){
        if(e.status===409&&e.data&&e.data.conferma){const r=await confermaAppuntamento(e.data.conferma,o.agente);if(!r)return;
          if(r.forza)forza=true;else{data=r.data;ora=r.ora;forza=false;$("#ad",m).value=data;$("#ah",m).value=ora}continue}

  if($("#nok",m))$("#nok",m).onclick=()=>done(()=>api(`/opportunities/${id}/nota`,{json:{nota:$("#nt",m).value}}),"Nota aggiunta");
}

const PSERV=[["ispettivo","Servizio ispettivo"],["allarme","Pronto intervento allarme"],["video","Videosorveglianza"],["videoisp","Videoispezioni"],["incendio","Collegamento incendio"]];

async function pvScarica(p){const r=await api(`/preventivi/${p.id}.pdf`,{raw:true});if(!r.ok)throw new Error("Download non riuscito ("+r.status+")");await pvScaricaBlob(r,`Preventivo-${p.numero}.pdf`)}

function pvInvia(p,o,id,reload){
  const m=modal(`<h2>Invia il preventivo al cliente${closeBtn}</h2><p class="small mut">${esc(p.numero)} · ${esc(p.cliente)} · canone mensile ${eur(p.totale)} + IVA</p>

   <p class="small mut">Dal telefono si apre direttamente la scelta dell'app (mail, WhatsApp…) con il PDF già allegato. Dal computer il PDF viene scaricato e si apre la mail già scritta: basta allegare il file scaricato.</p>
   <p class="row"><button class="btn ok" id="pisnd">✉ Invia</button><button class="btn sec" data-x>Annulla</button></p>`);

      const r=await api(`/preventivi/${p.id}.pdf`,{raw:true});if(!r.ok)throw new Error("PDF non disponibile ("+r.status+")");

      m.close();

      else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;a.click();
        if(mail)setTimeout(()=>{location.href=`mailto:${encodeURIComponent(mail)}?subject=${encodeURIComponent(oggetto)}&body=${encodeURIComponent(testo)}`},500);

async function caricaPreventivi(mo,o,id,reload){
  const box=$("#pvbox",mo);let L=[];

   ${L.map(p=>`<div class="pvrow small"><b>${esc(p.numero)}</b> · ${esc(p.data_richiesta.split("-").reverse().join("/"))} · ${eur(p.totale)}/mese + IVA<div class="mut">${p.servizi.map(esc).join(", ")}${p.inviato?` · <span style="color:var(--ok)">inviato ${fmtDT(p.inviato)}</span>`:" · non ancora inviato"}</div>
     <div class="row" style="margin-top:6px"><button class="btn sm sec" data-pv="${p.id}" data-a="s">⬇ PDF</button><button class="btn sm sec" data-pv="${p.id}" data-a="i">✉ Invia</button><button class="btn sm sec" data-pv="${p.id}" data-a="a">📅 Appuntamento</button></div></div>`).join("")}`;
  const mp={};L.forEach(p=>mp[p.id]=p);

    d.querySelector("[data-del]").onclick=()=>{d.remove();tot()};

const AG={agent_id:""};
async function pgAgenda(el){
  const qs=AG.agent_id?"?agent_id="+AG.agent_id:"";
  const d=await api("/agenda"+qs);
  el.innerHTML=`<h2>Agenda appuntamenti</h2><div class="card"><div class="row">
   ${showAgentFilter()?`<div><label>Agente</label><select id="ag">${agentOpts(AG.agent_id,"Tutti i visibili")}</select></div>`:""}
   ${AG.agent_id||!showAgentFilter()?`<button class="btn" id="prop">✨ Proponi agenda</button>`:""}
   <span class="small mut">Limite consigliato: ${d.max_giorno} appuntamenti al giorno (si può superare dopo conferma), raggruppati per località.</span></div></div>
   <div class="card"><div class="row"><div class="grow"><b>📅 Sincronizza con Outlook</b><div class="small mut">Vedi i tuoi appuntamenti e le scadenze SLA nel calendario di Outlook, del telefono o di Google.</div></div><button class="btn sec" id="calb">Collega calendario</button></div></div>
   ${d.da_ricalendarizzare.length?`<div class="card"><h3>Da ricalendarizzare (${d.da_ricalendarizzare.length})</h3>${d.da_ricalendarizzare.map(o=>item(o,o.motivo)).join("")}</div>`:""}
   ${d.giorni.map(g=>{const byLoc={};g.items.forEach(o=>(byLoc[o.localita||"Senza località"]=byLoc[o.localita||"Senza località"]||[]).push(o));
    return `<div class="card day"><h3><span>${fmtD(g.data)}</span><span class="badge ${g.items.length>d.max_giorno?"b-scad":""}">${g.items.length}/${d.max_giorno}</span></h3>${Object.entries(byLoc).map(([l,arr])=>`<div class="loc">📍 ${esc(l)}</div>${arr.map(o=>item(o)).join("")}`).join("")}</div>`}).join("")||'<div class="card mut">Nessun appuntamento in agenda.</div>'}`;
  function item(o,extra){return `<div class="item" data-id="${o.id}"><div><b>${esc(o.cliente)}</b><div class="small mut">${esc(o.localita)}${o.agente&&S.agenti.length>1?" · "+esc(o.agente):""}${extra?` · <span style="color:var(--warn)">${extra}</span>`:""}</div></div><div>${o.appuntamento&&o.stato==="appuntamento"?`<b>${o.appuntamento.slice(11,16)}</b>`:badge(o.stato)}</div></div>`}
  el.querySelectorAll(".item").forEach(i=>i.onclick=()=>openOpp(+i.dataset.id,()=>pgAgenda(el)));
  if($("#calb"))$("#calb").onclick=calendarioModal;
  if($("#ag"))$("#ag").onchange=e=>{AG.agent_id=e.target.value;pgAgenda(el)};
  if($("#prop"))$("#prop").onclick=async()=>{
    const aid=AG.agent_id||S.me.id;
    try{const p=await api("/agenda/proposta?agent_id="+aid);
      if(!p.length)return toast("Nessuna opportunità da pianificare");
      const m=modal(`<h2>Proposta agenda${closeBtn}</h2><p class="small mut">Opportunità raggruppate per località. Modifica data e ora se serve, poi conferma.</p><div class="tw"><table><tr><th>Cliente</th><th>Località</th><th>Data</th><th>Ora</th></tr>
        ${p.map((x,i)=>`<tr><td>${esc(x.cliente)}</td><td>${esc(x.localita)}</td><td><input type="date" data-i="${i}" data-k="data" value="${x.data}"></td><td><input type="time" data-i="${i}" data-k="ora" value="${x.ora}"></td></tr>`).join("")}</table></div>
        <p><button class="btn" id="cf">Conferma ${p.length} appuntamenti</button></p>`,true);
      m.querySelectorAll("input[data-i]").forEach(i=>i.onchange=()=>{p[+i.dataset.i][i.dataset.k]=i.value});
      $("#cf",m).onclick=async()=>{try{const r=await api("/agenda/proposta/conferma",{json:{items:p}});m.close();toast(`${r.fissati} fissati${r.errori.length?" · "+r.errori.length+" con errori: "+r.errori[0]:""}`,r.errori.length>0);pgAgenda(el)}catch(e){toast(e.message,1)}};
    }catch(e){toast(e.message,1)}};
}

/* ------------------------------------------------ messaggi e documenti */
const kb=n=>n>=1048576?(n/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(n/1024))+" KB";
const iconaF=m=>/^image\//.test(m)?"🖼️":m==="application/pdf"?"📕":/sheet|excel|csv/.test(m)?"📊":/word|document/.test(m)?"📝":"📄";
const fileLink=f=>`<a href="/api/file/${f.id}" title="Scarica" style="text-decoration:none">${iconaF(f.mime)} ${esc(f.nome)}</a> <span class="small mut">${kb(f.dimensione)}</span>${/^image\/|pdf$/.test(f.mime)?` <a class="small" href="/api/file/${f.id}?anteprima=1" target="_blank" rel="noopener">apri</a>`:""}`;
async function pgMessaggi(el,cart){
  cart=cart||"ricevuti";const invia=can("messaggi_invia");
  const L=await api("/messaggi"+(cart==="inviati"?"?cartella=inviati":""));
  el.innerHTML=`<div class="top"><h2>Messaggi</h2>${invia?'<button class="btn" id="mnew">✉️ Nuovo messaggio</button>':""}</div>
  ${invia?`<div class="row" style="margin-bottom:10px"><button class="btn ${cart==="ricevuti"?"":"sec"} sm" data-c="ricevuti">Ricevuti</button><button class="btn ${cart==="inviati"?"":"sec"} sm" data-c="inviati">Inviati</button></div>`:""}
  <div class="card">${L.map(m=>`<div class="item" data-id="${m.id}" style="${cart==="ricevuti"&&!m.letto?"border-left:4px solid var(--pri)":""}">
    <div class="row" style="justify-content:space-between"><div><b>${cart==="ricevuti"&&!m.letto?"● ":""}${esc(m.titolo)}</b>${m.n_allegati?` <span class="small mut">📎 ${m.n_allegati}</span>`:""}</div><div class="small mut">${fmtDT(m.creato)}</div></div>
    <div class="small mut">${cart==="ricevuti"?"Da "+esc(m.mittente):"A "+m.n_dest+" persone · letto da "+m.n_letti}${m.anteprima?" — "+esc(m.anteprima):""}</div></div>`).join("")||'<div class="mut">Nessun messaggio</div>'}</div>`;
  el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>pgMessaggi(el,b.dataset.c));
  el.querySelectorAll(".item").forEach(i=>i.onclick=()=>apriMessaggio(+i.dataset.id,()=>pgMessaggi(el,cart)));
  if($("#mnew",el))$("#mnew",el).onclick=()=>nuovoMessaggio(()=>pgMessaggi(el,"inviati"));
}
async function apriMessaggio(id,reload){
  const m=await api("/messaggi/"+id);
  const mo=modal(`<h2>${esc(m.titolo)}${closeBtn}</h2><div class="small mut">Da ${esc(m.mittente)} · ${fmtDT(m.creato)}</div>
   <div style="white-space:pre-wrap;margin:12px 0">${esc(m.testo)}</div>
   ${m.allegati.length?`<h3>Allegati</h3>${m.allegati.map(f=>`<div class="row" style="margin:4px 0">${fileLink(f)}${can("documenti")?` <button class="btn sec sm" data-sv="${f.id}">Salva nei miei documenti</button>`:""}</div>`).join("")}`:""}
   ${m.destinatari?`<h3 style="margin-top:14px">Destinatari (${m.destinatari.length}) · letto da ${m.destinatari.filter(d=>d.letto).length}</h3><div class="small" style="max-height:180px;overflow:auto">${m.destinatari.map(d=>`<div>${d.letto?"✔":"○"} ${esc(d.nome)} <span class="mut">${esc(d.ruolo)}${d.letto?" · letto "+fmtDT(d.letto):""}</span></div>`).join("")}</div>`:""}
   ${m.mio||S.me.ruolo==="admin"?'<p><button class="btn ko sm" id="mdel">Elimina messaggio</button></p>':""}`);
  mo.querySelectorAll("[data-sv]").forEach(b=>b.onclick=async()=>{try{await api(`/file/${b.dataset.sv}/salva`,{json:{}});toast("Salvato nei tuoi documenti")}catch(e){toast(e.message,1)}});
  if($("#mdel",mo))$("#mdel",mo).onclick=async()=>{if(!confirm("Eliminare il messaggio e i suoi allegati per tutti i destinatari?"))return;await api("/messaggi/"+id,{method:"DELETE"});mo.close();toast("Messaggio eliminato");reload&&reload()};
  if(reload&&!m.mio)reload();
}
async function nuovoMessaggio(fatto){
  const D=await api("/messaggi/destinatari");let scelti=[];
  const cnt=k=>D.filter(d=>d.ruolo===k).length;
  const mo=modal(`<h2>Nuovo messaggio${closeBtn}</h2>
   <label>A chi</label><select id="mmodo" style="width:100%"><option value="tutti">Tutti i miei venditori (${D.filter(d=>d.ruolo!=="ufficio_disdette").length})</option>
    ${cnt("agente")?`<option value="agente">Solo agenti (${cnt("agente")})</option>`:""}${cnt("recuperatore")?`<option value="recuperatore">Solo recuperatori disdette (${cnt("recuperatore")})</option>`:""}${cnt("team_leader")?`<option value="team_leader">Solo team leader (${cnt("team_leader")})</option>`:""}${cnt("district")?`<option value="district">Solo district (${cnt("district")})</option>`:""}
    <option value="scelti">Scelgo io le persone…</option></select><div id="msc" class="small mut" style="margin:4px 0"></div>
   <label>Oggetto</label><input id="mti" style="width:100%" maxlength="150" placeholder="es. Nuova campagna antifurto — da lunedì">
   <label>Messaggio</label><textarea id="mte" rows="6" style="width:100%" placeholder="Scrivi le informazioni per la tua squadra…"></textarea>
   <label>Allegati (max 10 file, 15 MB ciascuno)</label><input type="file" id="mfi" multiple style="width:100%">
   <p class="row"><button class="btn" id="msend">Invia</button><span class="small mut">I destinatari ricevono una notifica.</span></p><div id="merr" class="small" style="color:var(--ko)"></div>`);
  const pick=()=>multiPick({titolo:"Scegli i destinatari",tutti:"Nessuno",sel:scelti,
    voci:D.map(d=>({id:d.id,label:d.nome,sub:d.ruolo_label,gruppo:d.riferimento?"Fa capo a "+d.riferimento:"Diretti"})).sort((a,b)=>(a.gruppo||"").localeCompare(b.gruppo||"")),
    onOk:v=>{scelti=v.map(Number);$("#msc",mo).textContent=scelti.length+" persone scelte"}});
  $("#mmodo",mo).onchange=e=>{if(e.target.value==="scelti")pick();else{$("#msc",mo).textContent=""}};
  $("#msend",mo).onclick=async()=>{const b=$("#msend",mo);const f=new FormData();f.append("titolo",$("#mti",mo).value);f.append("testo",$("#mte",mo).value);
    const modo=$("#mmodo",mo).value;f.append("modo",modo);if(modo==="scelti")f.append("ids",JSON.stringify(scelti));
    for(const x of $("#mfi",mo).files)f.append("file",x);
    b.disabled=true;$("#merr",mo).textContent="Invio in corso…";
    try{const r=await api("/messaggi",{form:f});mo.close();toast("Inviato a "+r.destinatari+" persone"+(r.allegati?" con "+r.allegati+" allegati":"")+(r.errori.length?" — "+r.errori.join("; "):""),!!r.errori.length);fatto&&fatto()}
    catch(e){$("#merr",mo).textContent=e.message;b.disabled=false}};
}
async function pgDocumenti(el){
  const D=await api("/documenti");
  const up=(amb)=>`<div class="row" style="margin:8px 0">${amb==="comune"&&S.me.ruolo==="admin"?`<select id="uarea"><option value="">Tutte le aree</option>${D.aree.map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join("")}</select>`:""}${amb==="comune"?'<input id="ucart" placeholder="Cartella (facoltativa, es. Moduli)" style="width:220px">':""}<input type="file" id="u_${amb}" multiple class="grow"><button class="btn" data-up="${amb}">⬆ Carica</button></div>`;
  const perc=Math.min(100,Math.round(100*D.usato/D.quota));
  const cartelle=[...new Set(D.comuni.map(f=>f.cartella||""))].sort((a,b)=>a.localeCompare(b));
  el.innerHTML=`<h2>Documenti</h2>
  <div class="card"><h3>📚 Area comune</h3><p class="small mut" style="margin-top:0">Documenti a disposizione di tutti: moduli, listini, procedure, presentazioni.</p>
   ${D.puo_pubblicare?up("comune"):""}
   ${D.comuni.length?cartelle.map(cn=>`${cn?`<div class="small mut" style="margin:10px 0 2px;font-weight:600">📂 ${esc(cn)}</div>`:cartelle.length>1?'<div class="small mut" style="margin:10px 0 2px;font-weight:600">Senza cartella</div>':""}<div class="tw"><table class="small">${D.comuni.filter(f=>(f.cartella||"")===cn).map(f=>`<tr><td>${fileLink(f)}</td><td class="mut">${esc(f.autore)}${S.me.ruolo==="admin"?" · "+esc(f.area):""}</td><td class="mut">${fmtDT(f.creato)}</td><td style="white-space:nowrap">${can("documenti")?`<button class="btn sec sm" data-sv="${f.id}">Salva nei miei</button> `:""}${f.eliminabile?`<button class="btn ko sm" data-del="${f.id}">Elimina</button>`:""}</td></tr>`).join("")}</table></div>`).join(""):'<div class="mut small">Nessun documento nell\'area comune</div>'}</div>
  <div class="card"><h3>🔒 I miei documenti</h3><p class="small mut" style="margin-top:0">Il tuo spazio personale: li vedi solo tu. Usalo per salvare gli allegati ricevuti, offerte, contratti e materiale di lavoro.</p>
   <div class="small mut">Spazio usato: ${kb(D.usato)} su ${kb(D.quota)}</div><div style="height:6px;background:#0001;border-radius:4px;margin:4px 0 8px"><div style="height:6px;width:${perc}%;background:${perc>85?"var(--ko)":"var(--pri)"};border-radius:4px"></div></div>
   ${up("personale")}
   <div class="tw"><table class="small">${D.personali.map(f=>`<tr><td>${fileLink(f)}</td><td class="mut">${fmtDT(f.creato)}</td><td><button class="btn ko sm" data-del="${f.id}">Elimina</button></td></tr>`).join("")||'<tr><td class="mut">Nessun documento salvato</td></tr>'}</table></div></div>`;
  el.querySelectorAll("[data-up]").forEach(b=>b.onclick=async()=>{const amb=b.dataset.up,fi=$("#u_"+amb,el).files;if(!fi.length){toast("Scegli almeno un file",1);return}
    const f=new FormData();f.append("ambito",amb);for(const x of fi)f.append("file",x);if(amb==="comune"){f.append("cartella",$("#ucart",el).value);if($("#uarea",el))f.append("area_id",$("#uarea",el).value)}
    b.disabled=true;try{const r=await api("/documenti",{form:f});toast(r.salvati+" file caricati"+(r.errori.length?" — "+r.errori.join("; "):""),!!r.errori.length);pgDocumenti(el)}catch(e){toast(e.message,1);b.disabled=false}});
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Eliminare il documento?"))return;try{await api("/documenti/"+b.dataset.del,{method:"DELETE"});pgDocumenti(el)}catch(e){toast(e.message,1)}});
  el.querySelectorAll("[data-sv]").forEach(b=>b.onclick=async()=>{try{await api(`/file/${b.dataset.sv}/salva`,{json:{}});toast("Salvato nei tuoi documenti");pgDocumenti(el)}catch(e){toast(e.message,1)}});
}

const LIVD={certo:"Già presente",probabile:"Probabilmente già presente",indirizzo:"Stesso indirizzo",simile:"Nome simile"};
const dupBadge=(txt,liv)=>txt?`<div class="dup ${liv==="certo"?"certo":""}" title="${esc(txt)}">⚠ ${esc(txt.length>150?txt.slice(0,147)+"…":txt)}</div>`:"";
const dupLiv=t=>!t?"":/^Probabile:|^Nome simile:|^Stesso indirizzo:/.test(t)?"":"certo";
function selAreaHtml(){return S.me.ruolo==="admin"?`<div><label>Area</label><select id="varea">${S.meta.aree.map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join("")}</select></div>`:""}
function tabDup(L){return `<div class="tw" style="max-height:420px;overflow:auto"><table class="small"><tr><th>Riga</th><th>Cliente</th><th>Esito</th><th>Dove è già presente</th></tr>
  ${L.map(x=>`<tr class="rowdup ${x.livello}"><td>${x.riga}</td><td><b>${esc(x.cliente)}</b><div class="mut">${esc(x.telefono||"")}</div></td><td><span class="dup ${x.livello==="certo"?"certo":""}">${LIVD[x.livello]}</span>${x.in_lavorazione?'<div><span class="dup certo" title="Un altro venditore sta già lavorando questo cliente">🚫 già in lavorazione</span></div>':(x.forse_lavorazione?'<div><span class="dup" title="Il nome è simile a quello di un prospect già aperto da un altro venditore: controlla">forse già in lavorazione</span></div>':"")}</td>
   <td>${x.corrispondenze.map(m=>`<div>${esc(m.info)}${m.nome&&m.nome!==x.cliente?` <span class="mut">(${esc(m.nome)})</span>`:""} <span class="mut">· ${esc(m.motivo)}</span></div>`).join("")}</td></tr>`).join("")}</table></div>`}
async function pgVerifica(el){
  el.innerHTML=`<h2>Verifica clienti</h2><div class="card"><p class="small mut" style="margin-top:0">Controlla se dei nominativi sono <b>già clienti</b> (customer base dell'area), già in una <b>campagna</b> o già <b>proposti o in lavorazione da un altro venditore</b> (prospect aperti inclusi, così due agenti non vanno dallo stesso cliente). Il confronto usa partita IVA/codice fiscale, telefono e nome (anche scritto in modo diverso, ad esempio «Rossi S.r.l.» e «ROSSI SRL»).</p>
  <div class="row">${selAreaHtml()}<div class="grow"><label>Carica un file Excel/CSV (colonna «Cliente», facoltative «Telefono» e «P.IVA»)</label><input type="file" id="vf" accept=".xlsx,.xlsm,.csv" style="width:100%"></div></div>
  <label>…oppure incolla un elenco (un cliente per riga: <i>nome; telefono; partita IVA</i>)</label><textarea id="vt" rows="5" style="width:100%" placeholder="Mario Rossi Srl; 0421 123456; 01234567890"></textarea>
  <p class="row"><button class="btn" id="vgo">Verifica</button><button class="btn sec" id="vx" disabled>⬇ Scarica risultato (Excel)</button></p><div id="vres"></div></div>`;
  const fd=()=>{const f=new FormData();const file=$("#vf",el).files[0];if(file)f.append("file",file);else f.append("testo",$("#vt",el).value);if($("#varea",el))f.append("area_id",$("#varea",el).value);return f};
  $("#vgo",el).onclick=async()=>{const b=$("#vgo",el);b.disabled=true;$("#vres",el).innerHTML='<div class="mut small">Controllo in corso…</div>';
    try{const r=await api("/verifica",{form:fd()});
      $("#vres",el).innerHTML=`<p><b>${r.totale}</b> controllati · <b style="color:${r.duplicati?"var(--warn)":"var(--ok)"}">${r.duplicati}</b> già presenti · ${r.totale-r.duplicati} nuovi ${r.customer_base?"":'<span class="small mut">(la customer base dell\'area non è ancora stata caricata)</span>'}</p>
       ${r.in_lavorazione?`<div class="card" style="background:#fff1f0;box-shadow:none;border:1px solid #ffccc7;padding:10px 14px;margin-bottom:10px"><b style="color:var(--ko)">${r.in_lavorazione} ${r.in_lavorazione===1?"cliente è già in lavorazione":"clienti sono già in lavorazione"} da un altro venditore.</b> Non andarci: parlane prima con il tuo responsabile, così due persone non si presentano dallo stesso cliente.</div>`:""}
       ${r.duplicati?tabDup(r.righe.filter(x=>x.livello)):'<div style="color:var(--ok)">Nessun nominativo risulta già presente.</div>'}`;$("#vx",el).disabled=false}
    catch(e){$("#vres",el).innerHTML=`<span style="color:var(--ko)">${esc(e.message)}</span>`}b.disabled=false};
  $("#vx",el).onclick=async()=>{const r=await api("/verifica.xlsx",{form:fd(),raw:true});if(!r.ok){toast("Errore nel file",1);return}
    const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());a.download="verifica_clienti.xlsx";a.click()};
}
async function pgCB(el){

    $("#cbinfo",el).innerHTML=`<p><b style="font-size:20px">${d.totale.toLocaleString("it-IT")}</b> clienti in elenco ${d.storia[0]?`· ultimo aggiornamento <b>${fmtDT(d.storia[0].quando)}</b> (${esc(d.storia[0].utente||"")}, file ${esc(d.storia[0].file||"")})`:'· <span style="color:var(--warn)">nessuna customer base caricata</span>'}</p>

   <div class="card"><h3>Carica o aggiorna la customer base</h3><p class="small mut" style="margin-top:0">Colonne riconosciute: <b>Cliente</b> (obbligatoria), <b>P.IVA / Codice fiscale</b>, <b>Telefono</b>, Località, Indirizzo. Più dati ci sono, più il controllo è preciso.</p>
   <div class="row"><input type="file" id="cbf" accept=".xlsx,.xlsm,.csv" class="grow"><button class="btn" id="cbgo">Controlla il file</button></div><div id="cbprev" style="margin-top:10px"></div></div>`;

/* ------------------------------------------------ mappa */
const COL={contratti:"#16a34a",ko:"#dc2626",aperte:"#2563eb"};
let LMAP=null,LLOAD=null;
const LSRC=[["/static/leaflet/leaflet.css","/static/leaflet/leaflet.js"],
 ["https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css","https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"],
 ["https://unpkg.com/leaflet@1.9.4/dist/leaflet.css","https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"],
 ["https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css","https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"]];
function loadLeaflet(){
  if(window.L)return Promise.resolve(true);
  if(LLOAD)return LLOAD;
  LLOAD=(async()=>{
    for(const [cssU,jsU] of LSRC){
      const ok=await new Promise(res=>{
        const css=document.createElement("link");css.rel="stylesheet";css.href=cssU;document.head.appendChild(css);
        const sc=document.createElement("script");sc.src=jsU;const t=setTimeout(()=>{sc.remove();res(false)},7000);
        sc.onload=()=>{clearTimeout(t);res(!!window.L)};sc.onerror=()=>{clearTimeout(t);sc.remove();res(false)};document.head.appendChild(sc)});
      if(ok)return true}
    LLOAD=null;return false})();   // se fallisce, al prossimo tentativo si riprova
  return LLOAD;
}
function pieInner(p,size){
  const tot=p.contratti+p.ko+p.aperte,r=size/2;let a0=-Math.PI/2,g="";
  [["contratti"],["ko"],["aperte"]].forEach(([k])=>{const v=p[k];if(!v)return;const c=COL[k];
    if(v===tot){g+=`<circle cx="${r}" cy="${r}" r="${r-1}" fill="${c}"/>`;return}
    const a1=a0+2*Math.PI*v/tot,R=r-1;
    g+=`<path d="M${r} ${r}L${r+R*Math.cos(a0)} ${r+R*Math.sin(a0)}A${R} ${R} 0 ${a1-a0>Math.PI?1:0} 1 ${r+R*Math.cos(a1)} ${r+R*Math.sin(a1)}Z" fill="${c}"/>`;a0=a1});
  return g+`<circle cx="${r}" cy="${r}" r="${r-1}" fill="none" stroke="#fff" stroke-width="2"/><text x="${r}" y="${r+4}" text-anchor="middle" font-size="${Math.max(10,size/3)}" font-weight="700" fill="#fff" style="paint-order:stroke;stroke:#000a;stroke-width:2.5px">${tot}</text>`;
}
const pieSize=p=>Math.round(24+Math.min(28,5*Math.sqrt(p.contratti+p.ko+p.aperte)));
const popTxt=p=>`<b>${esc(p.comune)} (${esc(p.sigla)})</b><br><span style="color:${COL.contratti}">●</span> Contratti: <b>${p.contratti}</b><br><span style="color:${COL.ko}">●</span> KO: <b>${p.ko}</b><br><span style="color:${COL.aperte}">●</span> Opportunità/prospect in corso: <b>${p.aperte}</b>`;
const MAPPREF={cartina:true,zone:false};
async function drawMap(box,d){
  const nz=d.zone.length;
  const leg=`<div class="row small" style="margin-bottom:8px;align-items:center"><span><span style="color:${COL.contratti}">●</span> Contratti</span><span><span style="color:${COL.ko}">●</span> KO</span><span><span style="color:${COL.aperte}">●</span> Opportunità e prospect in corso</span>
    ${MAPPREF.zone&&nz?`<span><span style="color:#0a84ff">●</span> Zone di lavoro</span>`:""}
    <label class="chk" style="margin:0 0 0 auto"><input type="checkbox" id="mt" ${MAPPREF.cartina?"checked":""}> Cartina</label>
    <label class="chk" style="margin:0" title="${nz?"":"Per gli agenti scelti non sono state impostate zone di lavoro"}"><input type="checkbox" id="mz" ${MAPPREF.zone&&nz?"checked":""} ${nz?"":"disabled"}> Zone di lavoro${nz?` (${nz} comuni)`:" (nessuna impostata)"}</label></div>`;
  box.innerHTML=leg+`<div id="mapc" style="height:430px;border-radius:10px;overflow:hidden;background:#eef2f7;position:relative"></div>
   <div class="small mut" style="margin-top:6px">${d.punti.length} comuni con attività${d.non_localizzate?` · <b>${d.non_localizzate} senza comune riconosciuto</b>, quindi non sulla cartina${(d.esempi_non_localizzate||[]).length?": "+d.esempi_non_localizzate.map(esc).join("; ")+(d.non_localizzate>d.esempi_non_localizzate.length?"…":""):""}. Correggi la località nell'opportunità`:""}. Il numero nel cerchio è il totale delle opportunità del comune. Se la cartina non si vede, togli la spunta da «Cartina».</div>`;
  const mc=$("#mapc",box),mz=$("#mz",box);
  $("#mt",box).onchange=e=>{MAPPREF.cartina=e.target.checked;drawMap(box,d)};
  const zonaOn=()=>mz.checked&&nz>0;
  if(!d.punti.length&&!zonaOn()){mc.innerHTML='<div class="mut" style="padding:40px;text-align:center">Nessuna opportunità localizzata per i filtri scelti.'+(nz?' Spunta «Zone di lavoro» per vedere dove operano gli agenti.':'')+'</div>';
    mz.onchange=()=>{MAPPREF.zone=mz.checked;drawMap(box,d)};return}
  const ok=MAPPREF.cartina&&await loadLeaflet();
  if(ok){
    if(LMAP){try{LMAP.remove()}catch(e){}LMAP=null}
    const map=LMAP=L.map(mc,{scrollWheelZoom:false}).setView([42.5,12.5],6);
    const tl=L.tileLayer((S.meta&&S.meta.tile_url)||"https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:17,attribution:(S.meta&&S.meta.tile_attr)||"© OpenStreetMap",referrerPolicy:"strict-origin-when-cross-origin"}).addTo(map);
    let tOk=0,tKo=0;const avv=()=>{if(tKo>=4&&!tOk&&!mc.querySelector(".tavv")){const w=document.createElement("div");w.className="tavv small";w.style.cssText="position:absolute;left:8px;bottom:26px;right:8px;z-index:900;background:#fff3cd;border-radius:8px;padding:6px 10px;color:#7a5200";w.textContent="Le immagini della cartina non si caricano: la rete o il firewall potrebbe bloccare tile.openstreetmap.org. Le zone e le opportunità restano visibili.";mc.appendChild(w)}};
    tl.on("tileload",()=>{tOk++;const w=mc.querySelector(".tavv");if(w)w.remove()});tl.on("tileerror",()=>{tKo++;avv()});
    const pts=[];
    d.punti.forEach(p=>{const s=pieSize(p);
      L.marker([p.lat,p.lon],{icon:L.divIcon({className:"",html:`<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">${pieInner(p,s)}</svg>`,iconSize:[s,s],iconAnchor:[s/2,s/2]})}).bindPopup(popTxt(p)).addTo(map);pts.push([p.lat,p.lon])});
    const zl=L.layerGroup(d.zone.map(z=>L.circleMarker([z.lat,z.lon],{radius:5,color:"#0a84ff",weight:1,fillColor:"#0a84ff",fillOpacity:.35}).bindTooltip(esc(z.nome))));
    const zpts=d.zone.map(z=>[z.lat,z.lon]);
    const fit=()=>{const all=zonaOn()?pts.concat(zpts):pts;if(all.length)map.fitBounds(all,{padding:[40,40],maxZoom:10})};
    mz.onchange=()=>{MAPPREF.zone=mz.checked;if(mz.checked){zl.addTo(map)}else map.removeLayer(zl);fit();
      const lg=box.querySelector(".row.small");if(lg)drawMapLegendZone(lg,mz.checked)};
    if(zonaOn())zl.addTo(map);
    fit();
    setTimeout(()=>map.invalidateSize(),200);
  }else{mz.onchange=()=>{MAPPREF.zone=mz.checked};svgMap(mc,d,mz,MAPPREF.cartina)}
}
function drawMapLegendZone(lg,on){let z=lg.querySelector(".zleg");
  if(on&&!z){z=document.createElement("span");z.className="zleg";z.innerHTML='<span style="color:#0a84ff">●</span> Zone di lavoro';lg.insertBefore(z,lg.querySelector("label"))}
  if(!on&&z)z.remove()}
function svgMap(mc,d,zchk,volevaCartina){
  const W=900,H=430,P=40;
  const draw=()=>{
    const zon=zchk.checked&&d.zone.length>0;
    const all=d.punti.concat(zon?d.zone:[]);
    if(!all.length){mc.innerHTML='<div class="mut" style="padding:40px;text-align:center">Nessuna opportunità localizzata per i filtri scelti.</div>';return}
    let a=Math.min(...all.map(p=>p.lat)),b=Math.max(...all.map(p=>p.lat)),c=Math.min(...all.map(p=>p.lon)),e=Math.max(...all.map(p=>p.lon));
    if(b-a<.6){a-=.3;b+=.3}if(e-c<.6){c-=.3;e+=.3}
    const k=Math.cos(((a+b)/2)*Math.PI/180),sx=(W-2*P)/((e-c)*k),sy=(H-2*P)/(b-a),sc=Math.min(sx,sy);
    const ox=(W-(e-c)*k*sc)/2,oy=(H-(b-a)*sc)/2;
    const X=lon=>ox+(lon-c)*k*sc,Y=lat=>H-oy-(lat-a)*sc;
    let g="";
    for(let la=Math.ceil(a);la<=b;la++)g+=`<line x1="0" x2="${W}" y1="${Y(la)}" y2="${Y(la)}" stroke="#dbe3ee"/><text x="4" y="${Y(la)-3}" font-size="10" fill="#94a3b8">${la}°N</text>`;
    for(let lo=Math.ceil(c);lo<=e;lo++)g+=`<line y1="0" y2="${H}" x1="${X(lo)}" x2="${X(lo)}" stroke="#dbe3ee"/><text y="${H-4}" x="${X(lo)+3}" font-size="10" fill="#94a3b8">${lo}°E</text>`;
    if(zon)d.zone.forEach(z=>g+=`<circle cx="${X(z.lon)}" cy="${Y(z.lat)}" r="4.5" fill="#0a84ff" fill-opacity=".35" stroke="#0a84ff"><title>${esc(z.nome)}</title></circle>`);
    d.punti.forEach(p=>{const s=pieSize(p);g+=`<g transform="translate(${X(p.lon)-s/2},${Y(p.lat)-s/2})"><title>${esc(p.comune)} (${esc(p.sigla)}): contratti ${p.contratti}, KO ${p.ko}, in corso ${p.aperte}</title>${pieInner(p,s)}</g><text x="${X(p.lon)}" y="${Y(p.lat)+s/2+11}" font-size="10" text-anchor="middle" fill="#334155">${esc(p.comune)}</text>`});
    mc.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">${g}</svg><div class="small mut" style="position:absolute;left:8px;top:6px">${volevaCartina?"Cartina non raggiungibile da questa rete: vista semplificata":"Vista semplificata (cartina disattivata)"}</div>`;
  };
  zchk.addEventListener("change",draw);draw();
}
async function loadMap(qs){
  const box=$("#mapbox");if(!box)return;
  try{const d=await api("/mappa?"+qs);await drawMap(box,d)}catch(e){box.innerHTML=`<div style="color:var(--ko)">${esc(e.message)}</div>`}
}

/* ------------------------------------------------ zone di lavoro (regione > province > comuni) */
const GC={prov:{},com:{},reg:null};
async function geoReg(){return GC.reg||(GC.reg=await api("/geo/regioni"))}
async function geoProv(rid){return GC.prov[rid]||(GC.prov[rid]=await api("/geo/province?regioni="+rid))}
async function geoCom(pid){return GC.com[pid]||(GC.com[pid]=await api("/geo/comuni?province="+pid))}
function zonePicker(box,init){
  const Z={regioni:new Set(init.regioni||[]),province:new Set(init.province||[]),comuni:new Set(init.comuni||[])};
  const openP=new Set();let REG=[];const provIdx={};
  box.innerHTML=`<details class="dd" id="zr"><summary></summary><div class="ddb" id="zrb"></div></details>
   <details class="dd" id="zp"><summary></summary><div class="ddb" id="zpb"></div></details><div id="zc"></div>`;
  const sum=()=>{$("#zr summary",box).innerHTML=`① Regioni di lavoro <span class="badge">${Z.regioni.size} selezionate</span>`;
    $("#zp summary",box).innerHTML=`② Province di lavoro <span class="badge">${Z.province.size} selezionate</span>`;};
  async function renderReg(){
    REG=await geoReg();
    $("#zrb",box).innerHTML=REG.map(r=>`<label class="chk"><input type="checkbox" data-r="${r.id}" ${Z.regioni.has(r.id)?"checked":""}> ${esc(r.nome)}</label>`).join("");
    $("#zrb",box).querySelectorAll("[data-r]").forEach(i=>i.onchange=async()=>{const id=+i.dataset.r;
      if(i.checked)Z.regioni.add(id);else{Z.regioni.delete(id);
        for(const p of (GC.prov[id]||[])){Z.province.delete(p.id);(GC.com[p.id]||[]).forEach(c=>Z.comuni.delete(c.id))}}
      await renderProv();await renderCom();sum()});
  }
  async function renderProv(){
    const ids=[...Z.regioni];let h="";
    if(!ids.length)h='<div class="mut small">Seleziona prima almeno una regione.</div>';
    for(const rid of ids){const ps=await geoProv(rid);const rn=(REG.find(r=>r.id===rid)||{}).nome||"";
      ps.forEach(p=>provIdx[p.id]=p);
      h+=`<div class="loc">${esc(rn)} <a href="#" data-all="${rid}">tutte</a> · <a href="#" data-none="${rid}">nessuna</a></div>`+
        ps.map(p=>`<label class="chk"><input type="checkbox" data-p="${p.id}" ${Z.province.has(p.id)?"checked":""}> ${esc(p.nome)} <span class="mut">(${esc(p.sigla)})</span></label>`).join("");}
    const b=$("#zpb",box);b.innerHTML=h;
    b.querySelectorAll("[data-p]").forEach(i=>i.onchange=async()=>{const id=+i.dataset.p;
      if(i.checked)Z.province.add(id);else{Z.province.delete(id);(GC.com[id]||[]).forEach(c=>Z.comuni.delete(c.id))}
      await renderCom();sum()});
    b.querySelectorAll("[data-all],[data-none]").forEach(a=>a.onclick=async ev=>{ev.preventDefault();const all=a.dataset.all!=null,rid=+(a.dataset.all||a.dataset.none);
      for(const p of await geoProv(rid)){if(all)Z.province.add(p.id);else{Z.province.delete(p.id);(GC.com[p.id]||[]).forEach(c=>Z.comuni.delete(c.id))}}
      await renderProv();await renderCom();sum()});
  }
  async function renderCom(){
    const z=$("#zc",box);const ids=[...Z.province];
    if(!ids.length){z.innerHTML='<div class="mut small" style="margin-top:6px">③ Dopo aver scelto le province compaiono qui i comuni da selezionare.</div>';return}
    z.innerHTML="";
    for(const pid of ids){const p=provIdx[pid]||{nome:"Provincia",sigla:""};const cs=await geoCom(pid);
      const d=document.createElement("details");d.className="dd";if(openP.has(pid))d.open=true;
      const upd=()=>{const n=cs.filter(c=>Z.comuni.has(c.id)).length;
        d.querySelector("summary").innerHTML=`③ Comuni di ${esc(p.nome)} (${esc(p.sigla)}) <span class="badge">${n?n+" di "+cs.length+" selezionati":"tutta la provincia ("+cs.length+")"}</span>`};
      d.innerHTML=`<summary></summary><div class="ddb"><div class="row" style="margin-bottom:6px"><input class="grow" placeholder="Cerca comune…" data-q><button type="button" class="btn sec sm" data-a>Seleziona tutti</button><button type="button" class="btn sec sm" data-n>Nessuno</button></div>
        <div class="small mut" style="margin-bottom:4px">Se non scegli nessun comune vale l'intera provincia.</div>
        <div class="cols">${cs.map(c=>`<label class="chk" data-nm="${esc(c.nome.toLowerCase())}"><input type="checkbox" data-c="${c.id}" ${Z.comuni.has(c.id)?"checked":""}> ${esc(c.nome)}</label>`).join("")||'<span class="mut small">Nessun comune in archivio: carica l\'elenco da «Aree e geografia».</span>'}</div></div>`;
      d.addEventListener("toggle",()=>{d.open?openP.add(pid):openP.delete(pid)});
      d.querySelectorAll("[data-c]").forEach(i=>i.onchange=()=>{i.checked?Z.comuni.add(+i.dataset.c):Z.comuni.delete(+i.dataset.c);upd()});
      d.querySelector("[data-a]").onclick=()=>{d.querySelectorAll("[data-c]").forEach(i=>{if(i.closest("label").style.display!=="none"){i.checked=true;Z.comuni.add(+i.dataset.c)}});upd()};
      d.querySelector("[data-n]").onclick=()=>{d.querySelectorAll("[data-c]").forEach(i=>{i.checked=false;Z.comuni.delete(+i.dataset.c)});upd()};
      d.querySelector("[data-q]").oninput=e=>{const q=e.target.value.trim().toLowerCase();d.querySelectorAll("[data-nm]").forEach(l=>l.style.display=!q||l.dataset.nm.includes(q)?"":"none")};
      upd();z.appendChild(d);}
  }
  (async()=>{await renderReg();await renderProv();await renderCom();sum()})();
  return {get:()=>({regioni:[...Z.regioni],province:[...Z.province],comuni:[...Z.comuni]})};
}

     <div class="row small" style="margin:6px 0"><a href="#" data-all>Seleziona tutti</a><a href="#" data-none>Nessuno</a><span class="mut" data-cnt></span></div>

}

  const ruoliOk=S.me.ruolo==="admin"?["direttore",...RUOLI_FORM]:RUOLI_FORM;

   ${isNew?`<div><label>Utente (login)</label><input id="uu" autocapitalize="none" autocomplete="off"></div><div><label>Password iniziale (min. 8)</label><input id="up" type="text" autocomplete="off"></div>`:""}</div>
  <div class="row"><div><label>Ruolo</label><select id="ur">${ruoliOk.map(r=>`<option value="${r}" ${base.ruolo===r?"selected":""}>${RL(r)}</option>`).join("")}</select></div>
   ${S.me.ruolo==="admin"?`<div><label>Area</label><select id="ua">${S.meta.aree.map(a=>`<option value="${a.id}" ${areaId===a.id?"selected":""}>${esc(a.nome)}</option>`).join("")}</select></div>`:`<div><label>Area</label><div style="padding:8px 0">${esc(S.me.area||"")}</div></div>`}</div>

  <p class="row" style="margin-top:14px"><button class="btn" id="sv">Salva</button>${isNew?"":'<button class="btn sec" id="rp">Reimposta password</button>'}</p>`,true);
  const areaUsers=()=>us.filter(x=>x.area_id===areaId&&x.attivo&&(!u||x.id!==u.id));
  const opt=(arr,sel,none)=>(none?`<option value="">${none}</option>`:"")+arr.map(x=>`<option value="${x.id}" ${sel===x.id?"selected":""}>${esc(x.nome)}</option>`).join("");
  function hier(){
    const r=$("#ur",m).value,A=areaUsers(),dirs=A.filter(x=>x.ruolo==="direttore"),dists=A.filter(x=>x.ruolo==="district"),tls=A.filter(x=>x.ruolo==="team_leader");

    if(r==="district"||r==="recuperatore"||r==="ufficio_disdette"||r==="area_manager"){
      h.innerHTML=`<div class="grow"><label>${r==="district"?"Risponde a (Direttore di area o Area manager)":"Risponde a (Direttore di area)"}</label><select id="hd" style="width:100%">${opt(r==="district"?dirs.concat(A.filter(x=>x.ruolo==="area_manager")):dirs,H.dir)}</select>${dirs.length?"":'<div class="small" style="color:var(--ko)">Nessun Direttore in quest\'area: crealo prima.</div>'}</div>`;return}
    if(r==="team_leader"){
      h.innerHTML=`<div class="grow"><label>District che coordina questo Team Leader</label><select id="hd" style="width:100%">${opt(dists,H.district,"— Nessuno: risponde direttamente al Direttore —")}</select></div>`;
      $("#hd",m).onchange=e=>{H.district=+e.target.value||null};return}
    const tlList=H.district?tls.filter(t=>t.parent_id===H.district):tls;
    h.innerHTML=`<div class="grow"><label>District di riferimento</label><select id="hdi" style="width:100%">${opt(dists,H.district,"— Nessun District —")}</select></div>
     <div class="grow"><label>Team Leader che lo segue</label><select id="htl" style="width:100%">${tlList.map(t=>`<option value="${t.id}" ${H.tl===t.id?"selected":""}>${esc(t.nome)}${H.district?"":" ("+esc((byId(t.parent_id)||{nome:"senza district"}).nome)+")"}</option>`).join("").replace(/^/,`<option value="">${H.district?"— Nessun Team Leader: risponde direttamente al District —":"— Nessun Team Leader —"}</option>`)}</select></div>`;
    $("#hdi",m).onchange=e=>{H.district=+e.target.value||null;if(H.tl){const t=byId(H.tl);if(!t||t.parent_id!==H.district)H.tl=null}hier()};
    $("#htl",m).onchange=e=>{H.tl=+e.target.value||null;if(H.tl){const t=byId(H.tl);H.district=t?t.parent_id:H.district}hier()};
  }
  const parentId=()=>{const r=$("#ur",m).value,A=areaUsers(),dir=(A.find(x=>x.ruolo==="direttore")||{}).id||null;
    if(r==="direttore")return null;
    if(r==="district"||r==="recuperatore"||r==="ufficio_disdette"||r==="area_manager")return +($("#hd",m)||{}).value||dir;
    if(r==="team_leader")return H.district||dir;
    return H.tl||H.district||dir};
  const zoneUI=()=>{const r=$("#ur",m).value,show=r==="agente"||r==="recuperatore"||r==="area_manager";$("#zonebox",m).classList.toggle("hide",!show);
    if(show&&!zp)zp=zonePicker($("#zpick",m),zoneInit)};
  const permUI=()=>{const rr=$("#ur",m).value,def=new Set(S.meta.default_ruolo[rr]);
    $("#pm",m).innerHTML=S.meta.funzioni.map(f=>{const ov=base.override[f.id];const val=ov==null?"":(ov?"1":"0");
      return `<div>${esc(f.label)}</div><select data-f="${f.id}" ${rr==="admin"?"disabled":""}><option value="">Default (${def.has(f.id)?"sì":"no"})</option><option value="1" ${val==="1"?"selected":""}>Consenti</option><option value="0" ${val==="0"?"selected":""}>Nega</option></select>`}).join("")};
  $("#ur",m).onchange=()=>{hier();zoneUI();permUI()};
  if($("#ua",m))$("#ua",m).onchange=e=>{areaId=+e.target.value;H.district=null;H.tl=null;hier()};
  hier();zoneUI();permUI();
  $("#sv",m).onclick=async()=>{
    const permessi={};m.querySelectorAll("[data-f]").forEach(s=>permessi[s.dataset.f]=s.value===""?null:s.value==="1");

    const body={nome:$("#un",m).value,ruolo,parent_id:parentId(),permessi};
    if(S.me.ruolo==="admin")body.area_id=areaId;
    try{let id=u&&u.id;
      if(isNew){body.username=$("#uu",m).value;body.password=$("#up",m).value;id=(await api("/users",{json:body})).id;
        if(Object.values(permessi).some(v=>v!==null))await api("/users/"+id,{method:"PUT",json:{permessi}})}
      else{body.attivo=$("#uat",m).checked;await api("/users/"+id,{method:"PUT",json:body})}
      if(zp&&(ruolo==="agente"||ruolo==="recuperatore"||ruolo==="area_manager"))await api(`/users/${id}/geo`,{method:"PUT",json:zp.get()});
      m.close();toast("Salvato");try{S.agenti=await api("/agenti")}catch(e){}done()}catch(e){toast(e.message,1)}};
  if($("#rp",m))$("#rp",m).onclick=()=>{const pw=prompt("Nuova password temporanea (min. 8 caratteri). L'utente dovrà cambiarla al primo accesso.");if(pw)api(`/users/${u.id}/password`,{json:{password:pw}}).then(()=>toast("Password reimpostata")).catch(e=>toast(e.message,1))};
}

/* ------------------------------------------------ organigramma */
async function pgOrg(el){
  const L=await api("/organigramma");
  const ids=new Set(L.map(x=>x.id)),kids={};
  L.forEach(x=>{const p=ids.has(x.parent_id)?x.parent_id:0;(kids[p]=kids[p]||[]).push(x)});
  const ord={direttore:0,ufficio_disdette:0.5,area_manager:0.6,district:1,team_leader:2,agente:3,recuperatore:4};
  Object.values(kids).forEach(a=>a.sort((a,b)=>(ord[a.ruolo]-ord[b.ruolo])||a.nome.localeCompare(b.nome)));
  const byId=Object.fromEntries(L.map(x=>[x.id,x]));
  const nTL=L.filter(x=>x.ruolo==="team_leader").length,nD=L.filter(x=>x.ruolo==="district").length,nA=L.filter(x=>x.ruolo==="agente").length;
  const senzaTL=L.filter(x=>x.ruolo==="agente"&&!(byId[x.parent_id]&&byId[x.parent_id].ruolo==="team_leader"));
  const tlSenzaD=L.filter(x=>x.ruolo==="team_leader"&&!(byId[x.parent_id]&&byId[x.parent_id].ruolo==="district"));
  const canEdit=can("utenti");
  const node=n=>{
    const ch=kids[n.id]||[];
    const add=n.ruolo==="direttore"?[["area_manager","Area manager"],["district","District"],["team_leader","Team Leader"],["agente","Venditore"],["recuperatore","Recuperatore"],["ufficio_disdette","Ufficio Disdette"]]:n.ruolo==="area_manager"?[["district","District"],["team_leader","Team Leader"],["agente","Venditore"]]:n.ruolo==="district"?[["team_leader","Team Leader"],["agente","Venditore"]]:n.ruolo==="team_leader"?[["agente","Venditore"]]:[];
    return `<div class="orgn r-${n.ruolo}"><div class="orgc"><div class="orgt"><b>${esc(n.nome)}</b> <span class="badge">${esc(n.ruolo_label)}</span>${n.attivo?"":' <span class="badge">disattivo</span>'}
      ${n.zone.province.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}${n.zone.comuni?`<span class="small mut"> ${n.zone.comuni} comuni</span>`:""}</div>
      <div class="small mut">${["agente","recuperatore"].includes(n.ruolo)?`In corso <b>${n.aperte}</b> · <span style="color:var(--ok)">Contratti <b>${n.contratti}</b></span> · <span style="color:var(--ko)">KO <b>${n.ko}</b></span>`:`${ch.length} ${ch.length===1?"collaboratore diretto":"collaboratori diretti"}`}</div>
      ${canEdit?`<div class="row" style="margin-top:4px"><button class="btn sec sm" data-e="${n.id}">Modifica</button>${add.map(([r,t])=>`<button class="btn sec sm" data-add="${r}" data-par="${n.id}">+ ${t}</button>`).join("")}</div>`:""}</div>
      ${ch.length?`<div class="orgch">${ch.map(node).join("")}</div>`:""}</div>`;
  };
  const roots=kids[0]||[];
  const byArea={};roots.forEach(r=>(byArea[r.area||"—"]=byArea[r.area||"—"]||[]).push(r));
  const tb=canEdit?`<div class="card" style="padding:10px 14px"><div class="row" style="gap:8px;flex-wrap:wrap"><b style="margin-right:4px">Aggiungi alla rete:</b>${S.me.ruolo==="admin"?'<button class="btn sm" data-top="direttore">+ Direttore di area</button>':""}<button class="btn sm" data-top="area_manager">+ Area manager</button><button class="btn sm" data-top="district">+ District</button><button class="btn sm" data-top="team_leader">+ Team Leader</button><button class="btn sm" data-top="agente">+ Agente / Venditore</button><button class="btn sm" data-top="recuperatore">+ Recuperatore disdette</button></div></div>`:"";
  el.innerHTML=`<h2>Organigramma della rete</h2>${tb}
  <div class="kpis"><div class="kpi"><b>${nD}</b><span>District</span></div><div class="kpi"><b>${nTL}</b><span>Team Leader</span></div><div class="kpi"><b>${nA}</b><span>Venditori</span></div></div>
  ${senzaTL.length||tlSenzaD.length?`<div class="card small" style="border-color:#f5c26b;background:#fffaf0">${tlSenzaD.length?`<div>⚠ Team Leader senza District: ${tlSenzaD.map(x=>esc(x.nome)).join(", ")}</div>`:""}${senzaTL.length?`<div>ℹ Venditori che rispondono direttamente a District/Direttore (senza Team Leader): ${senzaTL.map(x=>esc(x.nome)).join(", ")}</div>`:""}</div>`:""}
  ${Object.entries(byArea).map(([a,rs])=>`<div class="card">${Object.keys(byArea).length>1||S.me.ruolo==="admin"?`<h3>${esc(a)}</h3>`:""}${rs.map(node).join("")}</div>`).join("")||'<div class="card mut">Nessun profilo ancora: creali da «Utenti».</div>'}`;
  if(canEdit){
    const withUsers=async fn=>{try{fn(await api("/users"))}catch(e){toast(e.message,1)}};
    el.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>withUsers(us=>userForm(us.find(u=>u.id==b.dataset.e),us,()=>pgOrg(el))));
    el.querySelectorAll("[data-top]").forEach(b=>b.onclick=()=>withUsers(us=>userForm(null,us,()=>pgOrg(el),{ruolo:b.dataset.top})));
    el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>withUsers(us=>{const p=byId(+b.dataset.par),r=b.dataset.add;
      const pre={ruolo:r,area_id:p.area_id};
      if(r==="team_leader"&&p.ruolo==="district")pre.district=p.id;
      if(r==="agente"){if(p.ruolo==="team_leader")pre.tl=p.id;else if(p.ruolo==="district")pre.district=p.id}
      userForm(null,us,()=>pgOrg(el),pre)}));
  }
}

   ${gs.completo?'<span class="badge b-contratto">Elenco completo</span>':'<span class="badge b-da_gestire">Elenco parziale</span>'}</p>
   ${gs.completo?"":'<p class="small">Per scegliere tutti i comuni d\'Italia serve caricare l\'elenco completo. Si può scaricare in automatico (serve internet) oppure caricare un file.</p>'}
   ${gs.messaggio?`<p class="small mut">Ultimo esito (${esc(gs.quando)}): ${esc(gs.messaggio)}</p>`:""}

  const reload=async()=>{S.meta=await api("/meta");pgAree(el)};

    $("#na").onsubmit=async e=>{e.preventDefault();try{await api("/areas",{json:{nome:$("#nan").value}});toast("Area creata");reload()}catch(x){toast(x.message,1)}};
    el.querySelectorAll("[data-ren]").forEach(b=>b.onclick=async()=>{const cur=ar.find(a=>a.id==b.dataset.ren);const n=prompt("Nuovo nome dell'area",cur.nome);if(n)try{await api("/areas/"+cur.id,{method:"PUT",json:{nome:n}});reload()}catch(x){toast(x.message,1)}});

    el.querySelectorAll("[data-dir]").forEach(b=>b.onclick=async()=>{try{const us=await api("/users");userForm(null,us,()=>pgAree(el),{ruolo:"direttore",area_id:+b.dataset.dir})}catch(x){toast(x.message,1)}});
  }
  $("#gdl").onclick=async e=>{const b=e.target;b.disabled=true;b.textContent="Download in corso…";$("#gmsg").textContent="";

}

  if(adm){const st=await api("/ai/stato").catch(()=>({attivo:false})),bx=document.createElement("div");bx.className="card";bx.style.maxWidth="620px";
    const draw=st=>{bx.innerHTML=`<h3>Assistente AI (Anthropic)</h3>
     <p class="small mut" style="margin-top:0">Con l'assistente AI gli agenti scrivono le richieste a parole loro («tutti i ristoranti della provincia di Gorizia») e il programma prepara la lista. Serve una chiave dell'account Anthropic (console.anthropic.com → API keys), a consumo: il costo dipende da quante richieste fanno gli agenti. Ogni utente può fare al massimo 40 richieste all'ora e 150 al giorno.</p>
     <p>Stato: <b style="color:${st.attivo?"var(--ok)":"var(--warn)"}">${st.attivo?"attivo":"non attivo"}</b>${st.attivo?` <span class="small mut">(chiave ${st.finale||""} · ${st.fonte==="server"?"impostata sul server":"salvata qui"} · modello ${esc(st.modello)})</span>`:""}</p>
     ${st.fonte==="server"?'<p class="small mut">La chiave è impostata come variabile del server (ANTHROPIC_API_KEY): per cambiarla modifica quella.</p>':`<label>${st.attivo?"Sostituisci la chiave":"Incolla la chiave"}</label><input id="aik" type="password" autocomplete="off" placeholder="sk-ant-…" style="width:100%">
     <p class="row"><button class="btn" id="ais">Salva chiave</button>${st.attivo?'<button class="btn sec" id="aid">Rimuovi chiave</button>':""}</p>`}
     ${st.attivo?'<p><button class="btn sec" id="aip">Prova il collegamento</button> <span class="small" id="aim"></span></p>':""}
     <p class="small mut">Attenzione: se salvi la chiave qui, finisce anche nella copia di sicurezza dei dati: conserva quel file con cura. Sul servizio online è più sicuro impostarla come variabile ANTHROPIC_API_KEY. Se l'assistente non funziona, gli agenti usano comunque la ricerca semplice.</p>`;
      if($("#ais",bx))$("#ais",bx).onclick=async()=>{try{draw(await api("/ai/chiave",{method:"PUT",json:{chiave:$("#aik",bx).value}}));toast("Chiave salvata")}catch(e){toast(e.message,1)}};
      if($("#aid",bx))$("#aid",bx).onclick=async()=>{if(!confirm("Togliere la chiave? L'assistente AI verrà disattivato."))return;try{draw(await api("/ai/chiave",{method:"PUT",json:{chiave:""}}))}catch(e){toast(e.message,1)}};
      if($("#aip",bx))$("#aip",bx).onclick=async()=>{const m=$("#aim",bx);m.textContent="Provo…";try{const r=await api("/ai/prova",{json:{}});m.style.color="var(--ok)";m.textContent="Funziona ✔ (modello "+r.modello+")"}catch(e){m.style.color="var(--ko)";m.textContent=e.message}}};
    draw(st);el.appendChild(bx)}
  if(adm){const gs=await api("/google/stato").catch(()=>({attivo:false})),gx=document.createElement("div");gx.className="card";gx.style.maxWidth="620px";
    const gdraw=st=>{gx.innerHTML=`<h3>Google Places (ricerca prospect)</h3>
     <p class="small mut" style="margin-top:0">Con la chiave Google la ricerca di attività usa Google Places al posto di OpenStreetMap: più telefoni e indirizzi aggiornati, nessuna attesa. Se Google non risponde il programma ripiega da solo su OpenStreetMap. La partita IVA non è fornita da Google. Costo a consumo: dopo le richieste gratuite del mese, circa 35 USD ogni 1.000 richieste con telefono e sito (verifica il listino su Google Cloud). Per limitare la spesa il programma blocca le ricerche dopo ${st.limite||300} richieste Google al giorno.</p>
     <p>Stato: <b style="color:${st.attivo?"var(--ok)":"var(--warn)"}">${st.attivo?"attivo":"non attivo"}</b>${st.attivo?` <span class="small mut">(chiave ${st.finale||""} · ${st.fonte==="server"?"impostata sul server":"salvata qui"} · richieste oggi: ${st.oggi||0}/${st.limite})</span>`:""}</p>
     ${st.fonte==="server"?'<p class="small mut">La chiave è impostata come variabile del server (GOOGLE_PLACES_KEY): per cambiarla modifica quella.</p>':`<label>${st.attivo?"Sostituisci la chiave":"Incolla la chiave"}</label><input id="gk" type="password" autocomplete="off" placeholder="AIza…" style="width:100%">
     <p class="row"><button class="btn" id="gks">Salva chiave</button>${st.attivo?'<button class="btn sec" id="gkd">Rimuovi chiave</button>':""}</p>`}
     ${st.attivo?'<p><button class="btn sec" id="gkp">Prova il collegamento</button> <span class="small" id="gkm"></span></p>':""}`;
      if($("#gks",gx))$("#gks",gx).onclick=async()=>{try{gdraw(await api("/google/chiave",{method:"PUT",json:{chiave:$("#gk",gx).value}}));toast("Chiave Google salvata")}catch(e){toast(e.message,1)}};
      if($("#gkd",gx))$("#gkd",gx).onclick=async()=>{if(!confirm("Togliere la chiave Google? La ricerca tornerà a usare OpenStreetMap."))return;try{gdraw(await api("/google/chiave",{method:"PUT",json:{chiave:""}}))}catch(e){toast(e.message,1)}};
      if($("#gkp",gx))$("#gkp",gx).onclick=async()=>{const m=$("#gkm",gx);m.textContent="Provo…";try{await api("/google/prova",{json:{}});m.style.color="var(--ok)";m.textContent="Funziona ✔"}catch(e){m.style.color="var(--ko)";m.textContent=e.message}}};
    gdraw(gs);el.appendChild(gx)}
  const save=async j=>{try{await api("/settings",{method:"PUT",json:j});S.meta=await api("/meta");toast("Impostazioni salvate")}catch(e){toast(e.message,1)}};
  $("#ss").onclick=()=>save({max_appuntamenti_giorno:$("#s2").value,regola_default:$("#s3").value});
  if($("#sl"))$("#sl").onclick=()=>{const j={sla_ore:$("#sg").value};el.querySelectorAll("[data-sla]").forEach(i=>j["sla_"+i.dataset.sla]=i.value);save(j)};
}
window.addEventListener("offline",()=>toast("Sei offline: i dati non si aggiornano",1));
window.addEventListener("online",()=>toast("Connessione ripristinata"));
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
}
boot();
</script>
</body>
</html>
